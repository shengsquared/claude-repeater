name: Claude repeater

# Timing does NOT come from this cron.
#
# Measured on this repo: GitHub's scheduler delivered scheduled runs 1-3 hours
# late (8/8 samples), and dropped ~90% of a '0,30 * * * *' cron. The `timezone:`
# field was also ignored and the expression executed as plain UTC. So cron is
# treated here as nothing more than "wake a runner up sometime" — the runner
# then sleeps until the real Madrid-local anchor and pings on the second.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'   # hourly, off-peak minute; late/dropped fires are expected and absorbed

permissions:
  actions: read     # read this workflow's own run history — that is where state lives
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # longest possible wait (5h05m) + overhead; hosted-runner cap is 6h
    env:
      GH_TOKEN: ${{ github.token }}
      # Madrid-local window anchors, spaced 5h01m. Exactly-5h spacing cannot
      # work: each ping lands a moment late, so the next window start is pushed
      # past the next anchor and the schedule walks forward every cycle.
      #
      # The extra minute is the safety margin, and it is deliberately not
      # smaller. A ping that lands inside a still-open window does not open a
      # new one, but `claude -p` still succeeds and the run still goes green, so
      # the miss is invisible and the next target is then computed from an
      # anchor that never existed. A margin of seconds only survives if the
      # window is exactly 5h from the message; a minute also survives the window
      # end rounding up to the next minute.
      TARGETS: "03:00 08:01 13:02 18:03"

    steps:
      - name: Work out when to ping, then wait for it
        id: plan
        run: |
          set -u
          floor=18000   # 5h — a message sooner than this lands inside the still-open window

          # Another run already awake means it is the one holding the next anchor.
          others=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow claude.yml \
                     --status in_progress --json databaseId -q '.[].databaseId' \
                   | grep -v "^${GITHUB_RUN_ID}$" || true)
          if [ -n "$others" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Already in flight: $(echo "$others" | tr '\n' ' ')— nothing to do."
            echo "ping=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # State is the run history itself: the newest run whose "Ping Claude"
          # step actually succeeded. Nothing to store, nothing to corrupt, and no
          # credential beyond the built-in token.
          last=0
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow claude.yml \
                        --limit 15 --json databaseId -q '.[].databaseId' \
                      | grep -v "^${GITHUB_RUN_ID}$"); do
            t=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                  -q '.jobs[].steps[] | select(.name=="Ping Claude" and .conclusion=="success") | .completed_at' \
                  2>/dev/null | head -1)
            if [ -n "$t" ]; then last=$(date -d "$t" +%s); break; fi
          done

          now=$(date +%s)

          # Absolute epochs for every anchor across yesterday/today/tomorrow, so
          # "previous" and "next" both resolve correctly across midnight and DST.
          prev=0; next=0
          for d in "-1 day" "now" "+1 day"; do
            day=$(TZ=Europe/Madrid date -d "$d" +%Y-%m-%d)
            for hm in $TARGETS; do
              t=$(TZ=Europe/Madrid date -d "$day $hm:00" +%s)
              if   [ "$t" -le "$now" ] && { [ "$prev" -eq 0 ] || [ "$t" -gt "$prev" ]; }; then prev=$t
              elif [ "$t" -gt "$now" ] && { [ "$next" -eq 0 ] || [ "$t" -lt "$next" ]; }; then next=$t
              fi
            done
          done

          echo "Madrid now      : $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M:%S %Z')"
          if [ "$last" -gt 0 ]; then
            echo "Last ping       : $(TZ=Europe/Madrid date -d "@$last" '+%Y-%m-%d %H:%M %Z')"
          else
            echo "Last ping       : none found in recent history"
          fi
          echo "Previous anchor : $(TZ=Europe/Madrid date -d "@$prev" '+%H:%M')"
          echo "Next anchor     : $(TZ=Europe/Madrid date -d "@$next" '+%H:%M')"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run — pinging now."
          elif [ "$last" -lt "$prev" ] && [ $(( now - last )) -ge "$floor" ]; then
            # An anchor went by unserved, i.e. GitHub delivered this run late.
            # Catch up now rather than idling until the next one.
            echo "Anchor $(TZ=Europe/Madrid date -d "@$prev" '+%H:%M') passed unserved — catching up now."
          else
            wait=$(( next - now ))
            echo "Nothing owed. Sleeping ${wait}s until $(TZ=Europe/Madrid date -d "@$next" '+%H:%M %Z')."
            sleep "$wait"
            # Re-check the floor on waking: a ping sooner than 5h after the last
            # one would be swallowed by the window that is still open.
            gap=$(( $(date +%s) - last ))
            if [ "$last" -gt 0 ] && [ "$gap" -lt "$floor" ]; then
              echo "Only ${gap}s since the last ping — window still open, skipping."
              echo "ping=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "ping=true" >> "$GITHUB_OUTPUT"

      - name: Ping Claude
        if: steps.plan.outputs.ping == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_THINKING_TOKENS: "0"
        run: |
          npm install -g @anthropic-ai/claude-code
          for attempt in 1 2 3 4 5; do
            echo "Attempt ${attempt}/5 at $(TZ=Europe/Madrid date '+%H:%M:%S %Z')"
            if claude -p "hi" --model claude-haiku-4-5-20251001 \
                 --max-turns 1 --max-budget-usd 0.03 --output-format json; then
              echo "Window opened at $(TZ=Europe/Madrid date '+%H:%M:%S %Z')."
              exit 0
            fi
            echo "Attempt ${attempt} failed — retrying in 60s"
            sleep 60
          done
          echo "All 5 attempts failed."
          exit 1
