name: Claude repeater

# A window opens when a message is sent and lasts five hours, so opening one at a
# chosen time means sending a message at that time. This workflow does that at
# four Madrid-local anchors a day (see TARGETS).
#
# It is a relay, not a cron job. GitHub's scheduler is not a clock: it delivers a
# fraction of the runs it is asked for, hours late, and a run can only sleep to an
# anchor if one was delivered beforehand. So each run sleeps to the next anchor,
# pings, and starts the next run itself with workflow_dispatch, which is not
# subject to the scheduler. The hourly cron below is only a restart if the relay
# ever breaks.
# The run name is how an emergency pause is recorded: see `override` below.
run-name: ${{ inputs.override == 'pause_24h' && 'PAUSE 24h' || inputs.override == 'resume' && 'RESUME' || 'Claude repeater' }}

on:
  workflow_dispatch:
    inputs:
      override:
        description: "EMERGENCY. pause_24h: no pings for 24 hours from now, then it resumes by itself. resume: cancel a pause early. Leave on none for normal runs."
        type: choice
        options: [none, pause_24h, resume]
        default: none
      chain:
        description: "Run as part of the relay: wait for the next anchor rather than pinging now. Leave off to ping immediately."
        type: boolean
        default: false
      dry_run:
        description: "Plan and hand off, but never call Claude. For testing the relay."
        type: boolean
        default: false
      hop_seconds:
        description: "Longest one run sleeps before handing off. Only lower this to test the relay."
        type: string
        default: "19800"
  schedule:
    - cron: '23 * * * *'   # relay restart only; its delivery time does not matter

permissions:
  actions: write    # read this workflow's run history, and dispatch the next run
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # a run sleeps at most 5h30m (HOP) and then pings; the hosted-runner cap is 6h
    env:
      GH_TOKEN: ${{ github.token }}
      # Madrid-local anchors, 5h01m apart. Exactly five hours cannot work: each
      # ping lands a moment after its anchor, so the next window could only open
      # a moment after the next one. The extra minute is the margin, and it is
      # not smaller on purpose: a ping inside a window that is still open opens
      # nothing but still succeeds, so the miss leaves no trace.
      TARGETS: "03:00 08:01 13:02 18:03"
      OVERRIDE: ${{ inputs.override }}
      CHAIN: ${{ inputs.chain }}
      DRY_RUN: ${{ inputs.dry_run }}
      HOP_SECONDS: ${{ inputs.hop_seconds }}

    steps:
      - name: Plan
        id: plan
        run: |
          set -u
          FLOOR=18000               # 5h: a message sooner than this lands inside the open window
          LATE_MAX=5400             # 90m: an anchor is still worth serving this late, and no later
          HOP=${HOP_SECONDS:-19800} # 5h30m: longest one run sleeps; a job may not live past 6h
          PARENT_WAIT=120           # a relay run waits this long for the run that started it to finish
          LEAD=30                   # re-check for a stray ping this long before the target
          PAUSE_SECONDS=86400       # an emergency pause lasts exactly this long, then lifts itself
          PAUSE_STEP=600            # while paused, look again this often so a resume takes effect quickly

          fmt() { TZ=Europe/Madrid date -d "@$1" '+%a %d %H:%M:%S %Z'; }
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          out "t0=$(date +%s)"

          # Ids of the other runs of this workflow that are alive or about to be.
          live_runs() {
            local s
            for s in in_progress queued; do
              gh run list --repo "$GITHUB_REPOSITORY" --workflow claude.yml --status "$s" \
                --json databaseId -q '.[].databaseId' 2>/dev/null || true
            done | grep -vx "$GITHUB_RUN_ID" || true
          }
          older_live() { live_runs | awk -v me="$GITHUB_RUN_ID" '$1 + 0 < me + 0'; }

          # Epoch of the newest successful "Ping Claude" step in the recent run history,
          # or 0. The history is the only state: nothing is written, so nothing can go
          # stale, and no credential beyond the built-in token is needed. In-progress
          # runs count, since the run that started this one may still be winding down.
          last_ping() {
            local id t
            for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow claude.yml \
                          --limit 40 --json databaseId -q '.[].databaseId' 2>/dev/null | grep -vx "$GITHUB_RUN_ID" || true); do
              t=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                    -q '.jobs[].steps[] | select(.name=="Ping Claude" and .conclusion=="success") | .completed_at' \
                    2>/dev/null | head -1 || true)
              if [ -n "$t" ]; then date -d "$t" +%s; return; fi
            done
            echo 0
          }

          # The emergency pause is a run, not a stored value: a manual run with override
          # set to pause_24h is named "PAUSE 24h", one set to resume is named "RESUME", and
          # the newest of either decides. A pause is over 24 hours after that run was
          # created, so it can never be forgotten. Needs no token and no commit.
          # Prints the epoch the pause ends, or 0 if there is none.
          pause_end() {
            local row created end
            row=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow claude.yml --limit 100 \
                    --json displayTitle,createdAt \
                    -q '[.[] | select(.displayTitle | test("^(PAUSE|RESUME)"))] | .[0] | "\(.displayTitle)|\(.createdAt)"' \
                    2>/dev/null || true)
            case "$row" in
              PAUSE*)
                created=$(date -d "${row#*|}" +%s)
                end=$(( created + PAUSE_SECONDS ))
                if [ "$end" -gt "$(date +%s)" ]; then echo "$end"; return; fi ;;
            esac
            echo 0
          }

          # An override run only records itself in the run history; it never holds the relay.
          case "${OVERRIDE:-none}" in
            pause_24h) echo "Pause recorded. No pings for 24 hours from this run's start; the relay stays alive and resumes on its own."
                       out "role=exit"; out "action=none"; exit 0 ;;
            resume)    echo "Resume recorded. Any pause is cancelled."
                       out "role=exit"; out "action=none"; exit 0 ;;
          esac

          # A manual run pings now. A scheduled run stands aside if any run is alive.
          # A relay run (started by the previous run) waits for that run to finish, and
          # stands aside only for an older one that is still going.
          manual=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${CHAIN:-}" != true ]; then manual=true; fi

          if [ "$manual" = false ]; then
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              alive=$(live_runs | tr '\n' ' ')
              if [ -n "$alive" ]; then
                echo "Run(s) $alive already alive — leaving it to them."
                out "role=exit"; out "action=none"; exit 0
              fi
            else
              deadline=$(( $(date +%s) + PARENT_WAIT ))
              while [ -n "$(older_live)" ] && [ "$(date +%s)" -lt "$deadline" ]; do sleep 5; done
              if [ -n "$(older_live)" ]; then
                echo "An older run is still going — it holds the relay, so this one stands down."
                out "role=exit"; out "action=none"; exit 0
              fi
            fi
          fi
          out "role=survivor"

          # Emergency pause: stay alive and send nothing. The relay keeps being handed on, so
          # it resumes on the first anchor after the pause with no restart. A manual
          # run is a deliberate ping and ignores the pause.
          if [ "$manual" = false ]; then
            idled=0
            while [ "$idled" -lt "$HOP" ]; do
              pe=$(pause_end)
              if [ "$pe" -le 0 ]; then break; fi
              step=$(( pe - $(date +%s) ))
              if [ "$step" -gt "$PAUSE_STEP" ]; then step=$PAUSE_STEP; fi
              if [ "$step" -gt $(( HOP - idled )) ]; then step=$(( HOP - idled )); fi
              if [ "$step" -lt 1 ]; then step=1; fi
              echo "Paused until $(fmt "$pe") — idling ${step}s."
              sleep "$step"
              idled=$(( idled + step ))
            done
            if [ "$idled" -gt 0 ]; then
              echo "Pause over or run budget spent — handing off so the next run plans afresh."
              out "action=none"; exit 0
            fi
          fi

          now=$(date +%s)
          last=$(last_ping)
          floor_at=$(( last + FLOOR ))

          # Every anchor from yesterday to tomorrow as an absolute epoch, so midnight
          # and DST need no special case. The days come from $now, not a second read
          # of the clock, so a run started just before midnight cannot split them.
          today=$(TZ=Europe/Madrid date -d "@$now" +%Y-%m-%d)
          anchors=""
          for d in "-1 day" "+0 day" "+1 day"; do
            day=$(date -d "$today $d" +%Y-%m-%d)
            for hm in $TARGETS; do
              anchors="$anchors $(TZ=Europe/Madrid date -d "$day $hm:00" +%s)"
            done
          done

          # Serve the earliest anchor that can still be served within LATE_MAX of its
          # time. A ping is never earlier than the anchor, than five hours after the
          # last ping (it would open nothing), or than now. So a run delivered a few
          # minutes late serves the anchor it missed; one delivered hours late skips
          # that slot and waits for the next anchor rather than pinging at a useless
          # hour and dragging every later anchor with it.
          target=$now; anchor=0
          if [ "$manual" = false ]; then
            target=0
            for a in $(printf '%s' "$anchors" | tr ' ' '\n' | sort -n); do
              t=$a
              if [ "$floor_at" -gt "$t" ]; then t=$floor_at; fi
              if [ "$now" -gt "$t" ]; then t=$now; fi
              if [ $(( t - a )) -le "$LATE_MAX" ]; then target=$t; anchor=$a; break; fi
            done
            if [ "$target" -eq 0 ]; then target=$now; fi
          fi

          echo "Now       : $(fmt "$now")"
          if [ "$last" -gt 0 ]; then echo "Last ping : $(fmt "$last")"; else echo "Last ping : none in recent history"; fi
          if [ "$manual" = true ]; then
            echo "Manual run — pinging now."
          else
            echo "Serving   : the $(fmt "$anchor") anchor, $(( (target - anchor) / 60 )) min late, at $(fmt "$target")"
          fi

          # The overnight gap is 8h57m and a job may live six hours, so one run cannot
          # sleep through it. Sleep as far as is safe and hand off; the next run picks
          # up the remainder. Each leg ends on an absolute target, so hand-off delay
          # never accumulates.
          wait=$(( target - now ))
          if [ "$wait" -lt 0 ]; then wait=0; fi
          if [ "$wait" -gt "$HOP" ]; then
            echo "Target is ${wait}s away — sleeping ${HOP}s, then handing off."
            sleep "$HOP"
            out "action=hop"; exit 0
          fi

          # Install the CLI now, not after waking, so the message goes out on the target.
          if [ "$wait" -gt 60 ] && [ "${DRY_RUN:-}" != true ]; then
            npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || echo "::warning::early install failed; the ping step will retry"
          fi

          lead=$(( target - LEAD - $(date +%s) ))
          if [ "$lead" -gt 0 ]; then sleep "$lead"; fi

          # A ping may have landed while we slept (a manual run, or a duplicate relay).
          # If we are now inside its window, pinging would open nothing: replan instead.
          if [ "$manual" = false ]; then
            if [ "$(pause_end)" -gt 0 ]; then
              echo "A pause was set while we slept — not pinging."
              out "action=none"; exit 0
            fi
            last2=$(last_ping)
            if [ "$last2" -gt "$last" ] && [ $(( target - last2 )) -lt "$FLOOR" ]; then
              echo "A ping landed at $(fmt "$last2") while we slept, so pinging now would open nothing — handing off to replan."
              out "action=none"; exit 0
            fi
          fi

          rest=$(( target - $(date +%s) ))
          if [ "$rest" -gt 0 ]; then sleep "$rest"; fi

          if [ "${DRY_RUN:-}" = true ]; then
            echo "Dry run — would ping now."
            out "action=dry"
          else
            out "action=ping"
          fi

      - name: Ping Claude
        id: ping
        if: steps.plan.outputs.action == 'ping'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_THINKING_TOKENS: "0"
        run: |
          if ! command -v claude >/dev/null 2>&1; then npm install -g @anthropic-ai/claude-code; fi
          for attempt in 1 2 3 4 5; do
            echo "Attempt ${attempt}/5 at $(TZ=Europe/Madrid date '+%H:%M:%S %Z')"
            if claude -p "hi" --model claude-haiku-4-5-20251001 \
                 --max-turns 1 --max-budget-usd 0.03 --output-format json; then
              echo "Window opened at $(TZ=Europe/Madrid date '+%H:%M:%S %Z')."
              exit 0
            fi
            echo "Attempt ${attempt} failed — retrying in 60s"
            sleep 60
          done
          echo "All 5 attempts failed."
          exit 1

      # Start the next run. Not on cancel: cancelling a run is how to stop the relay.
      - name: Hand off
        if: ${{ !cancelled() && steps.plan.outputs.role == 'survivor' }}
        env:
          PLAN_T0: ${{ steps.plan.outputs.t0 }}
          PING_OUTCOME: ${{ steps.ping.outcome }}
        run: |
          # Never hand off faster than once a minute, so a plan that ends in seconds
          # (a dry run, a catch-up) cannot turn the relay into a hot loop.
          elapsed=$(( $(date +%s) - ${PLAN_T0:-0} ))
          if [ "$elapsed" -lt 60 ]; then sleep $(( 60 - elapsed )); fi
          if [ "${PING_OUTCOME:-}" = failure ]; then
            echo "The ping failed — waiting ten minutes before the relay tries again."
            sleep 600
          fi
          for attempt in 1 2 3; do
            if gh workflow run claude.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
                 -f chain=true -f dry_run="${DRY_RUN:-false}" -f hop_seconds="${HOP_SECONDS:-19800}"; then
              echo "Handed off to the next run."
              exit 0
            fi
            echo "Dispatch attempt ${attempt} failed — retrying in 10s"
            sleep 10
          done
          echo "::error::Could not start the next run. The hourly cron will restart the relay."
          exit 1
