name: Claude repeater
on:
  schedule:
    - cron: '0 5,10,15,20 * * *'
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude -p "hi" --model claude-haiku-4-5-20251001 --output-format json
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
